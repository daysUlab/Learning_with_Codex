name: 場の量子論 教科書ビルド
on:
  push:
    branches: [main]
    paths:
      - 'physics_tower/12_quantum_field_theory/**'
      - '.github/workflows/build_qft_book.yml'
  pull_request:
    paths:
      - 'physics_tower/12_quantum_field_theory/**'
      - '.github/workflows/build_qft_book.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.34'
      - name: 日本語TeX環境を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk texlive-luatex texlive-lang-japanese texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-lang-english
          kpsewhich luatexbase.sty
          kpsewhich luatexja-fontspec.sty
          kpsewhich fontawesome5.sty
          lualatex --version
      - name: 依存関係と原稿を確認
        working-directory: physics_tower/12_quantum_field_theory
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/check.py
      - name: HTMLとPDFを生成
        working-directory: physics_tower/12_quantum_field_theory
        run: |
          quarto render
          test -s _book/index.html
          test -s _book/qft.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: ignore
          name: qft-book
          path: physics_tower/12_quantum_field_theory/_book
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: physics_tower/12_quantum_field_theory/_book
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: qft-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qft-book
          path: book
      - name: PDFの版をReleaseに保存
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s book/qft.pdf
          tag="qft-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" book/qft.pdf --clobber
          else
            gh release create "$tag" book/qft.pdf --target "$GITHUB_SHA" --prerelease --latest=false --title "場の量子論 初稿 $tag" --notes "原稿コミット: $GITHUB_SHA。未完成の初稿。最新版HTML/PDF: https://daysulab.github.io/Learning_with_Codex/"
          fi

  cleanup-legacy-qft:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: 旧版の教科書ビルド成果物と実行履歴のみ削除
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 旧版QFTの確認済み実行IDのみ。新しい実行・他ワークフローには触れない。
          for id in 46020137739 46020200872 46021137113 46021191272 46021519437 46021873254 46022235451 46022642008 46023629944 46023881894 46024729223 46025372762 46025424106 46025473052 46025518949 46025590931 46026267761; do
            if ! meta=$(gh api "repos/$GH_REPO/actions/runs/$id" 2>&1); then
              if [[ "$meta" == *"HTTP 404"* ]]; then
                echo "Already absent: $id"
                continue
              fi
              echo "$meta" >&2
              exit 1
            fi
            [[ "$(jq -r .path <<< "$meta")" == ".github/workflows/build_qft_book.yml" ]] || exit 1
            [[ "$id" != "$GITHUB_RUN_ID" ]] || exit 1
            [[ "$(jq -r .status <<< "$meta")" == "completed" ]] || { echo "Old run not complete: $id" >&2; exit 1; }
            gh api --paginate "repos/$GH_REPO/actions/runs/$id/artifacts" --jq '.artifacts[].id' | while read -r aid; do
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$aid"
            done
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id"
            echo "Deleted legacy QFT run: $id"
          done
