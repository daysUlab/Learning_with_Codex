name: 教科書共通ビルド・Pages公開
on:
  push:
    branches: [main]
    paths:
      - 'physics_tower/12_quantum_field_theory/**'
      - 'logic_tower/06_logic_and_analysis/**'
      - '.github/workflows/build_qft_book.yml'
      - '.github/workflows/build_logic_book.yml'
      - 'physics_tower/astrophysics_and_cosmology/**'
      - '.github/workflows/astrophysics-book.yml'
  pull_request:
    paths:
      - 'physics_tower/12_quantum_field_theory/**'
      - 'logic_tower/06_logic_and_analysis/**'
      - '.github/workflows/build_qft_book.yml'
      - '.github/workflows/build_logic_book.yml'
      - 'physics_tower/astrophysics_and_cosmology/**'
      - '.github/workflows/astrophysics-book.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: textbook-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cosmic:
    uses: ./.github/workflows/astrophysics-book.yml
  logic:
    uses: ./.github/workflows/build_logic_book.yml
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.34'
      - name: 日本語TeX環境を導入
        run: |
          # 不要な外部APTリポジトリの障害を回避（署名検証は維持）
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk texlive-luatex texlive-lang-japanese texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-lang-english poppler-utils
          kpsewhich luatexbase.sty
          kpsewhich luatexja-fontspec.sty
          kpsewhich fontawesome5.sty
          lualatex --version
      - name: 依存関係と原稿を確認
        working-directory: physics_tower/12_quantum_field_theory
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/check.py
      - name: HTMLとPDFを生成
        working-directory: physics_tower/12_quantum_field_theory
        run: |
          mkdir -p _quality
          set -o pipefail
          quarto render 2>&1 | tee _quality/render.log
          test -s _book/index.html
          test -s _book/qft.pdf
          python3 scripts/check_rendered.py
      - name: HTML画面幅別の表示診断
        continue-on-error: true
        working-directory: physics_tower/12_quantum_field_theory
        run: |
          python3 -m pip install playwright
          python3 scripts/check_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: ignore
          name: qft-quality
          path: physics_tower/12_quantum_field_theory/_quality
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          if-no-files-found: error
          name: qft-book
          path: physics_tower/12_quantum_field_theory/_book
  assemble:
    needs: [build, logic, cosmic]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qft-book
          path: site
      - name: 既存サイトとの衝突を検査
        run: |
          test -s site/index.html
          test -s site/qft.pdf
          test ! -e site/logic
          test ! -e site/cosmic
          test ! -e site/cosmic-physics
      - uses: actions/download-artifact@v4
        with:
          name: logic-book
          path: site/logic
      - uses: actions/download-artifact@v4
        with:
          name: cosmic-romance-book
          path: site/cosmic
      - uses: actions/download-artifact@v4
        with:
          name: cosmic-physics-book
          path: site/cosmic-physics
      - name: 四冊の生成物を確認
        run: |
          test -s site/index.html
          test -s site/qft.pdf
          test -s site/logic/index.html
          test -s site/logic/logic.pdf
          test -s site/cosmic/index.html
          test -s site/cosmic/cosmic-romance.pdf
          test -s site/cosmic-physics/index.html
          test -s site/cosmic-physics/cosmic-physics.pdf
          printf '%s\n' "$GITHUB_SHA" > site/textbook-version.txt
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: 四冊の公開と版を確認
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          for i in $(seq 1 10); do
            version=$(curl -fsSL --max-time 20 "$base/textbook-version.txt?v=$GITHUB_SHA" || true)
            if [ "$version" = "$GITHUB_SHA" ]; then break; fi
            sleep 10
          done
          test "$version" = "$GITHUB_SHA"
          for path in / /qft.pdf /logic/ /logic/logic.pdf /cosmic/ /cosmic/cosmic-romance.pdf /cosmic-physics/ /cosmic-physics/cosmic-physics.pdf; do
            curl -fsSL --retry 3 --max-time 60 "$base$path" -o /dev/null
          done
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [assemble, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qft-book
          path: qft
      - uses: actions/download-artifact@v4
        with:
          name: logic-book
          path: logic
      - name: 二冊のPDFを版別Releaseに保存
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for book in qft logic; do
            file="$book/$book.pdf"
            test -s "$file"
            tag="$book-${GITHUB_SHA:0:12}"
            if [ "$book" = qft ]; then
              title="場の量子論 $tag"
              url="https://daysulab.github.io/Learning_with_Codex/"
              status="全18章収録・目視と実読は継続検査。"
            else
              title="数理論理学と超準解析 執筆途中版 $tag"
              url="https://daysulab.github.io/Learning_with_Codex/logic/"
              status="執筆途中の版。未執筆章は収録しない。"
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$file" --clobber
            else
              gh release create "$tag" "$file" --target "$GITHUB_SHA" --prerelease --latest=false --title "$title" --notes "原稿コミット: $GITHUB_SHA。$status 最新版: $url"
            fi
          done
