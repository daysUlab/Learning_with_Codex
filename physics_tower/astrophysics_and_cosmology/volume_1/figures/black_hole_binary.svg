<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">伴星の運動から見えない質量を調べる</text><ellipse cx="320" cy="140" rx="235" ry="88" fill="none" stroke="#a9b9ca" stroke-dasharray="5 5"/><circle cx="140" cy="140" r="48" fill="#e5b657"/><ellipse cx="495" cy="140" rx="52" ry="24" fill="#c99450"/><circle cx="495" cy="140" r="14" fill="#263449"/><path d="M182 129 Q300 72 452 126" stroke="#c99450" stroke-width="6" fill="none" stroke-dasharray="9 6"/><text x="140" y="211" text-anchor="middle">伴星</text><text x="495" y="211" text-anchor="middle">暗い天体・高温ガス</text><text x="320" y="80" text-anchor="middle" font-size="15">ガスの流れ</text><text x="24" y="282" font-size="14">伴星の速度・周期・距離などを組み合わせて質量を推定する。</text></g></svg>