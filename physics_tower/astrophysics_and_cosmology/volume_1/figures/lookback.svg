<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330"><rect width="640" height="330" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#233247"><text x="20" y="32" font-weight="bold">光が届くまで、星の出来事は見えない</text><text x="100" y="69" text-anchor="middle">恒星</text><text x="540" y="69" text-anchor="middle">地球</text><line x1="100" y1="85" x2="100" y2="280" stroke="#8492a3" stroke-width="3" stroke-dasharray="5 5"/><line x1="540" y1="85" x2="540" y2="280" stroke="#8492a3" stroke-width="3" stroke-dasharray="5 5"/><circle cx="100" cy="105" r="12" fill="#d99b38"/><circle cx="540" cy="245" r="12" fill="#326ca6"/><line x1="112" y1="109" x2="526" y2="241" stroke="#326ca6" stroke-width="3" /><text x="320" y="158" text-anchor="middle">光の伝播</text><text x="100" y="92" text-anchor="middle">放射</text><text x="540" y="277" text-anchor="middle">受信</text><text x="25" y="310" >時間は下向き／100光年なら約100年の遅れ</text></g></svg>