<svg xmlns="http://www.w3.org/2000/svg" width="640" height="365" viewBox="0 0 640 365"><rect width="640" height="365" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="31" font-weight="bold">生命の証拠を判断する段階</text><rect x="70" y="55" width="500" height="40" rx="6" fill="#e3edf5" stroke="#7194b0"/><text x="320" y="80" text-anchor="middle" font-size="16">環境：水・エネルギー・化学成分</text><path d="M320 95 v16 m-5 -6 l5 6 l5 -6" stroke="#526579" fill="none"/><rect x="70" y="111" width="500" height="40" rx="6" fill="#e3edf5" stroke="#7194b0"/><text x="320" y="136" text-anchor="middle" font-size="16">観測：再現するスペクトルの特徴</text><path d="M320 151 v16 m-5 -6 l5 6 l5 -6" stroke="#526579" fill="none"/><rect x="70" y="167" width="500" height="40" rx="6" fill="#e3edf5" stroke="#7194b0"/><text x="320" y="192" text-anchor="middle" font-size="16">分子同定：他の分子・ノイズを検討</text><path d="M320 207 v16 m-5 -6 l5 6 l5 -6" stroke="#526579" fill="none"/><rect x="70" y="223" width="500" height="40" rx="6" fill="#e3edf5" stroke="#7194b0"/><text x="320" y="248" text-anchor="middle" font-size="16">起源：非生物的生成を検討</text><path d="M320 263 v16 m-5 -6 l5 6 l5 -6" stroke="#526579" fill="none"/><rect x="70" y="279" width="500" height="40" rx="6" fill="#e3edf5" stroke="#7194b0"/><text x="320" y="304" text-anchor="middle" font-size="16">独立した証拠による検証</text><text x="24" y="345" font-size="14">単一の分子候補を生命発見とみなさない。説明用の整理。</text></g></svg>