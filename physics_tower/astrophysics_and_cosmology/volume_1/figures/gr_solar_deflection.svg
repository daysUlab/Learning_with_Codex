<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">太陽の近くを通る光の曲がり</text><circle cx="70" cy="80" r="8" fill="#b47b3f"/><circle cx="315" cy="164" r="52" fill="#e8b452"/><circle cx="565" cy="164" r="10" fill="#527fa7"/><path d="M70 80 L290 88 Q380 90 565 164" stroke="#527fa7" stroke-width="3" fill="none"/><path d="M565 164 L70 0" stroke="#b47b3f" stroke-dasharray="5 5" fill="none"/><text x="24" y="63" font-size="15">背景星</text><text x="315" y="171" text-anchor="middle">太陽</text><text x="565" y="195" text-anchor="middle">地球</text><text x="220" y="63" font-size="14">逆向きにたどった見かけの方向</text><text x="24" y="280" font-size="14">曲がりは太陽の縁で約1.75秒角（図は大幅に誇張）。</text></g></svg>