<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310"><rect width="640" height="310" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">光時計：同じ光速、異なる光の道のり</text><text x="145" y="65" text-anchor="middle">時計と共に動く系</text><text x="465" y="65" text-anchor="middle">外側の慣性系</text><g stroke="#718397" stroke-width="5"><path d="M110 90 H180 M110 220 H180 M350 220 H410 M435 90 H495 M520 220 H580"/></g><path d="M139 215 V96 M151 96 V215" stroke="#c28a37" stroke-width="3" fill="none"/><path d="M380 215 L465 96 L550 215" stroke="#c28a37" stroke-width="3" fill="none"/><text x="145" y="254" text-anchor="middle" font-size="15">垂直の経路</text><text x="465" y="254" text-anchor="middle" font-size="15">鏡の移動に伴い斜めの経路</text><text x="24" y="289" font-size="14">外側の系では光の経路が長い。鏡・距離は模式的。</text></g></svg>