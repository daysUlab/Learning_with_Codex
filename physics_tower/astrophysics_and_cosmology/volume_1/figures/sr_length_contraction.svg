<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310"><rect width="640" height="310" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">運動方向の長さを同時刻で測る</text><text x="24" y="75" font-size="15">棒と共に動く系</text><rect x="140" y="96" width="440" height="24" rx="4" fill="#527fa7"/><text x="360" y="145" text-anchor="middle">100 m（固有長）</text><text x="24" y="190" font-size="15">別の慣性系：光速の80%で運動</text><rect x="140" y="211" width="264" height="24" rx="4" fill="#527fa7"/><path d="M420 223 H555 l-10 -6 m10 6 l-10 6" stroke="#b47b3f" stroke-width="2" fill="none"/><text x="272" y="258" text-anchor="middle">60 m</text><text x="24" y="291" font-size="14">各系で両端の位置を同時に測った長さ。写真の外観とは異なる。</text></g></svg>