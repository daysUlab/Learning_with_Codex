<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270"><rect width="640" height="270" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#233247" font-size="17"><text x="24" y="32" font-weight="bold">宇宙の元素が身体に届くまで</text><rect x="24" y="57" width="176" height="55" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="112" y="90" font-size="15" text-anchor="middle">原始水素・ヘリウム</text><rect x="232" y="57" width="176" height="55" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="320" y="90" font-size="15" text-anchor="middle">恒星の誕生・核融合</text><rect x="440" y="57" width="176" height="55" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="528" y="90" font-size="15" text-anchor="middle">恒星風・爆発・合体</text><rect x="440" y="165" width="176" height="55" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="528" y="198" font-size="15" text-anchor="middle">元素を含むガスと塵</text><rect x="232" y="165" width="176" height="55" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="320" y="198" font-size="15" text-anchor="middle">太陽系・地球の形成</text><rect x="24" y="165" width="176" height="55" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="112" y="198" font-size="15" text-anchor="middle">水・岩石・生物</text><g fill="none" stroke="#526579" stroke-width="2"><path d="M200 85 H232 l-8 -6 m8 6 l-8 6 M408 85 H440 l-8 -6 m8 6 l-8 6 M528 112 V165 l-6 -8 m6 8 l6 -8 M440 193 H408 l8 -6 m-8 6 l8 6 M232 193 H200 l8 -6 m-8 6 l8 6"/><path d="M485 165 Q365 115 320 112" stroke="#b16c31" stroke-dasharray="5 4"/></g><text x="398" y="140" text-anchor="middle" font-size="13" fill="#9c5a24">次世代の恒星へ</text><text x="24" y="253" font-size="14">複数の供給源が混合する。単一の恒星から一直線に来るわけではない。</text></g></svg>