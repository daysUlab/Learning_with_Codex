<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315" viewBox="0 0 640 315"><rect width="640" height="315" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#233247" font-size="17"><text x="24" y="30" font-weight="bold">恒星の運命は初期質量などで分かれる</text><rect x="25" y="65" width="175" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="112.5" y="91" text-anchor="middle" font-size="15">低質量の形成天体</text><rect x="25" y="140" width="175" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="112.5" y="166" text-anchor="middle" font-size="15">太陽程度の恒星</text><rect x="25" y="215" width="175" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="112.5" y="241" text-anchor="middle" font-size="15">十分重い恒星</text><rect x="265" y="65" width="150" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="340" y="91" text-anchor="middle" font-size="15">褐色矮星</text><rect x="265" y="140" width="150" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="340" y="166" text-anchor="middle" font-size="15">赤色巨星など</text><rect x="265" y="215" width="150" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="340" y="241" text-anchor="middle" font-size="15">核崩壊</text><rect x="465" y="140" width="150" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="540" y="166" text-anchor="middle" font-size="15">白色矮星</text><rect x="465" y="215" width="150" height="42" rx="6" fill="#e3edf5" stroke="#6b8da7"/><text x="540" y="241" text-anchor="middle" font-size="15">中性子星・BH</text><path d="M200 86 H265 l-9 -6 m9 6 l-9 6" stroke="#526579" fill="none" stroke-width="2"/><path d="M200 161 H265 l-9 -6 m9 6 l-9 6" stroke="#526579" fill="none" stroke-width="2"/><path d="M200 236 H265 l-9 -6 m9 6 l-9 6" stroke="#526579" fill="none" stroke-width="2"/><path d="M415 161 H465 l-9 -6 m9 6 l-9 6" stroke="#526579" fill="none" stroke-width="2"/><path d="M415 236 H465 l-9 -6 m9 6 l-9 6" stroke="#526579" fill="none" stroke-width="2"/><text x="24" y="291" font-size="14">BH：ブラックホール。白色矮星を含む連星はIa型超新星を起こす場合もある。</text></g></svg>