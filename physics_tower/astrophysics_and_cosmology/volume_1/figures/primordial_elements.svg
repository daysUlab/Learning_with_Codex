<svg xmlns="http://www.w3.org/2000/svg" width="640" height="235" viewBox="0 0 640 235"><rect width="640" height="235" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#233247" font-size="17"><text x="24" y="32" font-weight="bold">初期宇宙の通常物質（質量比の概数）</text><rect x="30" y="77" width="435" height="68" fill="#427ca8"/><rect x="465" y="77" width="145" height="68" fill="#c78738"/><text x="247" y="105" text-anchor="middle" fill="#fff">水素</text><text x="247" y="129" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">約75%</text><text x="537" y="105" text-anchor="middle" fill="#fff">ヘリウム</text><text x="537" y="129" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">約25%</text><text x="30" y="184" font-size="15">重水素・リチウムなどの微量成分は省略。</text><text x="30" y="210" font-size="15">ダークマター・ダークエネルギーは分母に含めない。</text></g></svg>