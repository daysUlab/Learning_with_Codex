<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">銀河中心を公転する恒星S2（概念図）</text><ellipse cx="317" cy="145" rx="220" ry="90" fill="none" stroke="#527fa7" stroke-width="3"/><circle cx="116" cy="145" r="12" fill="#24364b"/><circle cx="97" cy="145" r="6" fill="#d6a146"/><circle cx="537" cy="145" r="6" fill="#d6a146" opacity=".5"/><path d="M116 157 L170 210 H290" stroke="#6b7b8d" fill="none"/><text x="295" y="215" font-size="15">中心質量：約400万太陽質量</text><text x="24" y="77" font-size="15">最近接距離：約120 AU</text><path d="M100 84 L104 129" stroke="#6b7b8d"/><text x="400" y="82" font-size="15">公転周期：約16年</text><text x="24" y="282" font-size="14">軌道の形状は説明用。恒星の観測位置を再現したものではない。</text></g></svg>