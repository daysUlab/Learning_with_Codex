<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280"><rect width="640" height="280" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="31" font-weight="bold">降着円盤と角運動量の輸送</text><ellipse cx="320" cy="140" rx="190" ry="75" fill="#eed6a8" stroke="#bb9050"/><ellipse cx="320" cy="140" rx="115" ry="45" fill="#e5ad59"/><ellipse cx="320" cy="140" rx="40" ry="26" fill="#263449"/><path d="M145 140 H255 l-10 -6 m10 6 l-10 6 M495 140 H385 l10 -6 m-10 6 l10 6" stroke="#28658a" stroke-width="3" fill="none"/><path d="M250 190 H120 l10 -6 m-10 6 l10 6 M390 190 H520 l-10 -6 m10 6 l-10 6" stroke="#a16a35" stroke-width="3" fill="none"/><text x="320" y="75" text-anchor="middle" font-size="15">高温のガス</text><text x="320" y="232" text-anchor="middle" font-size="15">青：物質の内向き移動　茶：角運動量の外向き輸送</text><text x="24" y="263" font-size="14">円盤は模式的。実際の輸送・放射は磁場や乱流に依存。</text></g></svg>