<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310"><rect width="640" height="310" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">恒星の表面温度と見かけの色（概念）</text><circle cx="110" cy="95" r="39" fill="#d97c58" stroke="#9ba9b7"/><text x="110" y="155" text-anchor="middle">赤み</text><text x="110" y="179" font-size="15" text-anchor="middle">約3,000 K</text><circle cx="320" cy="95" r="39" fill="#f5edcf" stroke="#9ba9b7"/><text x="320" y="155" text-anchor="middle">白色</text><text x="320" y="179" font-size="15" text-anchor="middle">約5,800 K</text><circle cx="530" cy="95" r="39" fill="#a9c8ef" stroke="#9ba9b7"/><text x="530" y="155" text-anchor="middle">青白色</text><text x="530" y="179" font-size="15" text-anchor="middle">約15,000 K</text><rect x="24" y="207" width="592" height="65" rx="7" fill="#edf3f7"/><text x="36" y="231" font-size="15">可視光の色：温度・赤化などの情報</text><text x="36" y="255" font-size="15">赤外線・X線の代表色：波長や強度を色で表現</text><text x="24" y="294" font-size="13">色・直径は模式的。実際の色度や光度・サイズの比較ではない。</text></g></svg>