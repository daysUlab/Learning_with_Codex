<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">リング・影・地平面は別の量</text><rect x="24" y="50" width="282" height="210" rx="5" fill="#202a39"/><circle cx="165" cy="147" r="67" fill="none" stroke="#e0a34d" stroke-width="22"/><circle cx="165" cy="147" r="54" fill="#151c26"/><text x="165" y="152" text-anchor="middle" fill="#fff">影</text><text x="165" y="242" text-anchor="middle" fill="#fff" font-size="15">観測画像の平面（概念）</text><rect x="334" y="50" width="282" height="210" rx="5" fill="#edf2f7"/><circle cx="475" cy="147" r="51" fill="#24364b"/><circle cx="475" cy="147" r="51" stroke="#c58c4c" stroke-width="3" fill="none"/><path d="M526 147 H593" stroke="#c58c4c" stroke-width="2"/><text x="475" y="219" text-anchor="middle" font-size="15">事象の地平面</text><text x="475" y="242" text-anchor="middle" font-size="15">物理空間の断面（概念）</text><text x="24" y="285" font-size="14">両図は異なる空間を示し、同じ縮尺ではない。</text></g></svg>