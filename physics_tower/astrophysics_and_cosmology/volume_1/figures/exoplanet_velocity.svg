<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310"><rect width="640" height="310" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">恒星と惑星は共通の重心を回る</text><ellipse cx="320" cy="150" rx="220" ry="85" fill="none" stroke="#9aa8b7" stroke-dasharray="5 5"/><ellipse cx="320" cy="150" rx="45" ry="18" fill="none" stroke="#527ca4" stroke-width="2"/><circle cx="275" cy="150" r="39" fill="#e9b853"/><circle cx="540" cy="150" r="15" fill="#6ba28a"/><circle cx="320" cy="150" r="4" fill="#233247"/><text x="320" y="117" text-anchor="middle">重心</text><text x="275" y="210" text-anchor="middle">恒星</text><text x="540" y="180" text-anchor="middle">惑星</text><path d="M58 150 H16 l8 -6 m-8 6 l8 6" stroke="#3977a5" stroke-width="3" fill="none"/><text x="22" y="125" font-size="14">地球方向</text><text x="25" y="273" font-size="15">恒星の速度の視線方向成分をスペクトルから測る。</text></g></svg>