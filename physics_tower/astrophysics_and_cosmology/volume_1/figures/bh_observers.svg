<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">留まる観測者と自由落下する観測者</text><circle cx="250" cy="150" r="80" fill="#28384e" stroke="#b47b3f" stroke-width="3"/><text x="250" y="155" text-anchor="middle" fill="#fff">内側</text><circle cx="365" cy="87" r="14" fill="#e7b856"/><path d="M365 87 L414 60" stroke="#b47b3f" stroke-width="3"/><text x="419" y="57" font-size="15">静止：加速が必要</text><path d="M502 178 Q400 178 280 178" fill="none" stroke="#527fa7" stroke-width="3" stroke-dasharray="6 4"/><path d="M280 178 l12 -7 m-12 7 l12 7" fill="none" stroke="#527fa7" stroke-width="3"/><circle cx="388" cy="178" r="10" fill="#527fa7"/><text x="390" y="205" font-size="15">自由落下</text><text x="24" y="279" font-size="14">地平面を有限の固有時で通過。物質の壁ではない。</text></g></svg>