<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><rect width="640" height="300" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">地平面と信号の行き先（概念図）</text><circle cx="225" cy="155" r="95" fill="#28384e"/><circle cx="225" cy="155" r="95" stroke="#b47b3f" stroke-width="3" fill="none"/><circle cx="182" cy="115" r="5" fill="#fff"/><path d="M182 115 L216 144 m-12 -3 l12 3 l-4 -11" stroke="#fff" fill="none" stroke-width="2"/><circle cx="362" cy="155" r="5" fill="#467ba5"/><path d="M362 155 H490 l-10 -7 m10 7 l-10 7" stroke="#467ba5" stroke-width="3" fill="none"/><text x="225" y="190" text-anchor="middle" fill="#fff" font-size="15">内側から遠方へ</text><text x="225" y="211" text-anchor="middle" fill="#fff" font-size="15">信号は届かない</text><text x="430" y="139" font-size="15" text-anchor="middle">遠方へ届く経路</text><path d="M225 60 L280 45 H390" stroke="#b47b3f" fill="none"/><text x="397" y="50" font-size="15">事象の地平面</text><text x="24" y="282" font-size="14">光の速さが局所的にゼロになるという意味ではない。</text></g></svg>