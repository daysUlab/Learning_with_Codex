<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310"><rect width="640" height="310" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="32" font-weight="bold">地球と代表的な中性子星</text><circle cx="155" cy="119" r="61" fill="#6ba28a"/><circle cx="470" cy="119" r="29" fill="#678cb7"/><text x="155" y="202" text-anchor="middle">地球</text><text x="470" y="202" text-anchor="middle">中性子星（例）</text><text x="155" y="229" text-anchor="middle">直径 約12,700 km</text><text x="470" y="229" text-anchor="middle">直径 24 km</text><text x="155" y="256" text-anchor="middle">地球1個分の質量</text><text x="470" y="256" text-anchor="middle">地球 約47万個分</text><text x="24" y="290" font-size="14">円は別々の縮尺で表示。実際の直径比は約530対1。</text></g></svg>