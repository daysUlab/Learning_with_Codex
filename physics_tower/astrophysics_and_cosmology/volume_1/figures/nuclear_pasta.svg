<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290"><rect width="640" height="290" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="32" font-weight="bold">核パスタの形状候補（模式図）</text><rect x="18" y="56" width="184" height="178" rx="8" fill="#edf2f6" stroke="#b8c5d1"/><circle cx="60" cy="90" r="13" fill="#668db5"/><circle cx="110" cy="90" r="13" fill="#668db5"/><circle cx="160" cy="90" r="13" fill="#668db5"/><circle cx="60" cy="130" r="13" fill="#668db5"/><circle cx="110" cy="130" r="13" fill="#668db5"/><circle cx="160" cy="130" r="13" fill="#668db5"/><circle cx="60" cy="170" r="13" fill="#668db5"/><circle cx="110" cy="170" r="13" fill="#668db5"/><circle cx="160" cy="170" r="13" fill="#668db5"/><text x="110" y="217" text-anchor="middle">球状</text><rect x="228" y="56" width="184" height="178" rx="8" fill="#edf2f6" stroke="#b8c5d1"/><rect x="257" y="78" width="19" height="112" rx="9" fill="#668db5"/><rect x="297" y="78" width="19" height="112" rx="9" fill="#668db5"/><rect x="337" y="78" width="19" height="112" rx="9" fill="#668db5"/><rect x="377" y="78" width="19" height="112" rx="9" fill="#668db5"/><text x="320" y="217" text-anchor="middle">棒状</text><rect x="438" y="56" width="184" height="178" rx="8" fill="#edf2f6" stroke="#b8c5d1"/><rect x="460" y="81" width="140" height="22" rx="3" fill="#668db5"/><rect x="460" y="122" width="140" height="22" rx="3" fill="#668db5"/><rect x="460" y="163" width="140" height="22" rx="3" fill="#668db5"/><text x="530" y="217" text-anchor="middle">板状</text><text x="24" y="270" font-size="14">理論が予測する形状の例。直接観測や数値計算結果ではない。</text></g></svg>