<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310"><rect width="640" height="310" fill="#fff"/><g font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#233247"><text x="24" y="30" font-weight="bold">同時性は慣性系によって異なる</text><rect x="120" y="70" width="400" height="58" rx="6" fill="#e3edf5" stroke="#7194b0"/><circle cx="138" cy="99" r="9" fill="#d5a047"/><circle cx="502" cy="99" r="9" fill="#d5a047"/><text x="320" y="103" text-anchor="middle">ホーム系：同時に発光</text><rect x="120" y="165" width="400" height="58" rx="6" fill="#e3edf5" stroke="#7194b0"/><circle cx="138" cy="194" r="9" fill="#d5a047"/><circle cx="502" cy="194" r="9" fill="#d5a047"/><text x="320" y="198" text-anchor="middle">列車系：前端の発光が先</text><text x="138" y="245" text-anchor="middle" font-size="14">後端：後</text><text x="502" y="245" text-anchor="middle" font-size="14">前端：先</text><path d="M450 58 H520 l-9 -6 m9 6 l-9 6" stroke="#527fa7" stroke-width="2" fill="none"/><text x="24" y="290" font-size="14">各系の同期時計で光の伝播時間を考慮した発光時刻を比較する。</text></g></svg>