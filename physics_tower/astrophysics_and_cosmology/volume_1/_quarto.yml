project:
  type: book
  output-dir: _book
  pre-render: python3 scripts/fetch_images.py

lang: ja
book:
  title: "数式なしでわかる宇宙のロマン"
  subtitle: "人類はどこまで宇宙を理解したのか"
  author: "Learning with Codex"
  output-file: cosmic-romance
  search: true
  downloads: [pdf]
  repo-url: https://github.com/daysUlab/Learning_with_Codex
  chapters:
    - index.qmd
    - chapters/01_cosmic_scale.qmd
    - chapters/02_looking_back.qmd
    - chapters/03_galaxies_cosmic_web.qmd
    - chapters/04_why_stars_shine.qmd
    - chapters/05_stellar_evolution.qmd
    - chapters/06_origin_of_elements.qmd
    - chapters/07_exoplanets.qmd
    - chapters/08_habitability.qmd
    - chapters/09_neutron_stars.qmd
    - chapters/10_pulsars_magnetars.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    html-math-method: mathjax
    toc: true
  pdf:
    pdf-engine: lualatex
    documentclass: scrreprt
    papersize: a5
    fontsize: 11pt
    geometry: margin=17mm
    toc: true
    include-in-header: japanese.tex
