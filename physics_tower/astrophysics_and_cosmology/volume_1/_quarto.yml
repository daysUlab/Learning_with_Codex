project:
  type: book
  output-dir: _book

lang: ja
book:
  title: "数式なしでわかる宇宙のロマン"
  subtitle: "人類はどこまで宇宙を理解したのか"
  author: "Learning with Codex"
  output-file: cosmic-romance
  search: true
  repo-url: https://github.com/daysUlab/Learning_with_Codex
  chapters:
    - index.qmd
    - chapters/01_cosmic_scale.qmd
    - chapters/02_looking_back.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    html-math-method: mathjax
    toc: true
  pdf:
    pdf-engine: lualatex
    documentclass: scrreprt
    papersize: a5
    fontsize: 11pt
    geometry: margin=17mm
    toc: true
    include-in-header: japanese.tex
